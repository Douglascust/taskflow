spring:
  application:
    name: TaskFlow
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/taskflow_db}
    username: ${POSTGRES_USER:taskflow_user}
    password: ${POSTGRES_PASSWORD:taskflow_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    root: INFO

# CORS configuration for development
# (Will be overridden by a Bean in code)

github:
  token: ${GITHUB_TOKEN}
  sync:
    interval: ${GITHUB_SYNC_INTERVAL:3600000}

ai:
  endpoint: ${AI_ENDPOINT:http://localhost:11434/api/generate}
  model: ${AI_MODEL:llama3}
  api-key: ${AI_API_KEY:}
