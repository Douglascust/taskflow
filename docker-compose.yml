version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskflow_db
      POSTGRES_USER: taskflow_user
      POSTGRES_PASSWORD: taskflow_pass
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "taskflow_user", "-d", "taskflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_URL=jdbc:postgresql://db:5432/taskflow_db
      - POSTGRES_USER=taskflow_user
      - POSTGRES_PASSWORD=taskflow_pass
      - SERVER_PORT=8080
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_SYNC_INTERVAL=${GITHUB_SYNC_INTERVAL:-3600000}
      - AI_ENDPOINT=http://host.docker.internal:11434/api/generate
      - AI_MODEL=gemma4:31b-cloud
    ports:
      - "8082:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  db-data:
    driver: local
